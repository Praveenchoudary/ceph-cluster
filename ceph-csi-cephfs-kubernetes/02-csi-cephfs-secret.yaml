apiVersion: v1
kind: Secret
metadata:
  name: csi-cephfs-secret
  namespace: ceph-csi
stringData:
  # Get the real value on ceph1:  ceph auth get-key client.k8s
  # DO NOT commit the real key to git. Fill this in locally only,
  # or apply via `kubectl create secret` directly (see README).
  #
  # userID/userKey  -> used by the node plugin to MOUNT the volume
  # adminID/adminKey -> used by the provisioner to CREATE/DELETE subvolumes
  # client.k8s needs these caps on the Ceph side:
  #   mon 'allow r'
  #   mgr 'allow *'
  #   osd 'allow rw pool=cephfs_data, allow rw pool=cephfs_metadata'
  #   mds 'allow *'
  userID: k8s
  userKey: "REPLACE_WITH_ceph_auth_get-key_client.k8s"
  adminID: k8s
  adminKey: "REPLACE_WITH_ceph_auth_get-key_client.k8s"
